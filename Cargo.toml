[workspace]
resolver = "2"
members = ["tilekit", "mandelbrot", "life", "filters", "raymarch", "light2d", "sand"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
# crates.io only has 0.3.1; main (0.4.0) is what the book documents.
# Pinned because the project is pre-1.0 and breaks API often.
cutile = { git = "https://github.com/NVlabs/cutile-rs", rev = "d92c160" }
cuda-core = { git = "https://github.com/NVlabs/cutile-rs", rev = "d92c160" }
tilekit = { path = "tilekit" }
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# X11 only: WSLg provides an X server, and this avoids needing Wayland dev packages.
minifb = { version = "0.28", default-features = false, features = ["x11"] }

[profile.release]
debug = 1
