[workspace]
resolver = "2"
members = ["mandelbrot"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
# crates.io only has 0.3.1; main (0.4.0) is what the book documents.
# Pinned because the project is pre-1.0 and breaks API often.
cutile = { git = "https://github.com/NVlabs/cutile-rs", rev = "d92c160" }
cuda-core = { git = "https://github.com/NVlabs/cutile-rs", rev = "d92c160" }
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
debug = 1
